<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Список записей</title></head>
<body><h1>Список записей</h1><ol id="list"></ol>
<script>function renderList(xs){return xs.map(x=>"<li>"+x.title+" — "+x.price+" ₽</li>").join("")}
fetch("/api/items").then(r=>r.json()).then(xs=>{document.getElementById("list").innerHTML=renderList(xs)})</script>
</body></html>
