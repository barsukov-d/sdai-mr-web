<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Список записей</title></head>
<body><h1>Список записей</h1><ul id="list"></ul>
<script>fetch("/api/items").then(r=>r.json()).then(xs=>{document.getElementById("list").innerHTML=xs.map(x=>"<li>"+x.title+"</li>").join("")})</script>
</body></html>
